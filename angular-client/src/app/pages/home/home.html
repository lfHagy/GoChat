<main class="home-wrapper">
  <aside class="options-ribbon">
    <button mat-icon-button class="ribbon-button" (click)="toggleContactBar()">
      <mat-icon>
        @if (totalUnreadMessages()) { mark_chat_unread }
        @else { chat_bubble }
      </mat-icon>
    </button>
    <button mat-icon-button class="ribbon-button"><mat-icon>person_add</mat-icon></button>
    <button mat-icon-button class="ribbon-button"><mat-icon>settings</mat-icon></button>
    <button mat-icon-button class="ribbon-button" (click)="userService.logout()"><mat-icon>logout</mat-icon></button>
  </aside>

  <mat-sidenav-container class="sidenav-wrapper">
    <mat-sidenav #contactBar [opened]="contactBarOpen()" class="contact-bar" mode="side">
      <app-contact-bar />
    </mat-sidenav>

    <div class="chat-panel">
      <router-outlet />
    </div>
  </mat-sidenav-container>
</main>
