<span class="contact-card-wrapper" (click)="contactSelected()" [class.selected-contact]="this.contact.id === selectedContact()?.id">
    <div id="contact-profile-picture-status" [style.backgroundColor]="statusColors[contact.status]" matBadge="1">
        <img src="https://placehold.co/80" id="contact-profile-picture" />
    </div>

    <div class="contact-card-info">
        <h3>{{ contact.username }}</h3>
        <p>{{ contact.status }}</p>
    </div>
</span>
